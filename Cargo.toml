[package]
name = "wksp"
version = "0.1.0"
edition = "2021"
description = "CLI for managing a domain/workspace/repo Git workspace hierarchy"
license = "MIT"
authors = ["Joe Ralph"]
repository = "https://github.com/jralph/wksp"

[[bin]]
name = "wksp"
path = "src/main.rs"

[lib]
name = "wksp"
path = "src/lib.rs"

[dependencies]
clap = { version = "=4.6.4", features = ["derive"] }
clap_complete = "=4.6.1"
anyhow = "=1.0.104"
thiserror = "=2.0.18"
dialoguer = "=0.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
console = "=0.16.1"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
opt-level = 3
lto = true
strip = true
